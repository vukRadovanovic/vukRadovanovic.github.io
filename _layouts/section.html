---
layout: default
---
{{ content }}
<div class="projects">
{% for p in site[page.subnav] %}
  <div class="project">
    {% if p.image %}<img src="{{ p.image | relative_url }}" alt="" style="object-fit: {{ p.fit | default: 'cover' }}; object-position: {{ p.crop | default: 'center' }}">{% endif %}
    <div>
      <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
      {{ p.abstract | markdownify }}
    </div>
  </div>
{% endfor %}
</div>
